# Gitleaks configuration for tests/security/test_security_secret_scan.py (owner: agent F).
#
# Extends the upstream default rule set. Every allowlist entry below was
# reviewed by agent F and must stay as narrow as possible (a specific rule and
# a specific value shape). Request additions in docs/team/interface-changes/F.md;
# never allowlist a whole directory of real configuration.

title = "ExtorQ secret scan (gitleaks defaults + reviewed allowlist)"

[extend]
useDefault = true

[[allowlists]]
description = "ExtorQ SourceType identifiers such as k8s.api_inventory (catalog.py) are not credentials"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ['''^(linux|macos|k8s|github|scanner|extorq)\.[a-z0-9_]+$''']

[[allowlists]]
description = "Public OpenPGP v4 fingerprints assigned to *_KEY_FPR shell variables (infra/vm/vm.sh pins the Ubuntu cloud-image signing key)"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''^\s*[A-Z][A-Z0-9_]*_KEY_FPR="[0-9A-F]{40}"\s*$''']

[[allowlists]]
description = "F-22 (resolved 2026-11-22: E builds the synthetic sample at runtime, so the working-tree entry was removed). History only: commit 4ee5baa added the synthetic 'api_key: ...' sample to E's sanitiser test; history is never rewritten. Commit AND path must both match, so any new occurrence anywhere, including this file, is reported."
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["4ee5baae876717ecdfc00e45a7bad5ffe3b71d6a"]
paths = ['''(^|/)tests/unit/ai/test_ai_sanitize\.py$''']

[[allowlists]]
description = "SSH public-key fingerprints in sshd log lines ('key ED25519 SHA256:<43 base64>'): public identifiers, not secrets (B1 journald fixtures)"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''key (?:RSA|DSA|ECDSA|ED25519|ECDSA-SK|ED25519-SK) SHA256:[A-Za-z0-9+/]{43}''']

[[allowlists]]
description = "Public OpenPGP v4 fingerprint in the official python image's GPG_KEY environment variable (C3 Trivy image fixtures)"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''GPG_KEY=[0-9A-F]{40}(?:[^0-9A-Za-z]|$)''']
