# Optional deployment for an operator-approved Jev request budget (`make up-demo`).
services:
  ai-worker:
    networks: [data, edge]
    environment:
      EXTORQ_JEV_ENABLED: "true"
      EXTORQ_JEV_DAILY_CAP: ${EXTORQ_JEV_DAILY_CAP:?Set EXTORQ_JEV_DAILY_CAP to the approved budget}
      JEV_API_KEY_FILE: /run/secrets/jev_api_key
    secrets:
      - jev_api_key

secrets:
  jev_api_key:
    file: ${EXTORQ_JEV_KEY_PATH:-./var/secrets/jev_api_key}
