# Native macOS endpoint collector. No secrets in this file: the gateway token is read
# from var/secrets/tokens/macos-workstation-01.token. Runs as the logged-in user with
# read-only commands only (no sudo, no Full Disk Access, no configuration profile).
# Field reference and data-minimisation decisions: docs/telemetry/macos.md.
collectors:
  - collector_id: macos-workstation-01
    producer_id: macos-workstation-01
    asset_id: macos:workstation-01
    module: extorq_collectors.macos.collector:MacOSCollector
    # The runner calls the collector every 60 s; each source below runs when due.
    interval_seconds: 10
    enabled: true
    settings:
      unified_log:
        enabled: true
        interval_seconds: 10
        # Names only; predicates are fixed in code (unified_log.PRODUCERS).
        producers:
          - sudo
          - sshd
          - screensharing
          - opendirectory_auth
          - authorization
          - screen_lock
          - xprotect
          - gatekeeper
        initial_lookback_seconds: 900
        overlap_seconds: 10
        settle_seconds: 5
        max_window_seconds: 900
        max_backfill_seconds: 86400
        max_records_per_cycle: 5000
        max_output_bytes: 33554432
        command_timeout_seconds: 120
        resolve_generated_uid: true
      launchd:
        enabled: true
        interval_seconds: 10
        full_inventory_seconds: 3600
        # Known-legitimate labels: events are STILL emitted, with attributes.allowlisted=true.
        allowlist:
          - "homebrew.mxcl.*"
          - "sh.brew.*"
          - "com.docker.*"
          - "com.google.keystone.*"
          - "com.google.GoogleUpdater.*"
      listeners:
        # Listening sockets every minute: an all-interfaces listener is security relevant
        # (MAC-003) and short-lived listeners would be missed by the 300 s inventory.
        enabled: true
        interval_seconds: 10
        include_udp: true
        full_inventory_seconds: 3600
        command_timeout_seconds: 30
      inventory:
        enabled: true
        interval_seconds: 300
        include_process_args: false
        verify_executable_paths: true
        accounts: true
        full_inventory_seconds: 3600
        command_timeout_seconds: 30
      services:
        enabled: true
        stale_after_seconds: 600
      posture:
        enabled: true
        interval_seconds: 300
        max_admin_accounts: 1
        os_update_medium_after_days: 14
        command_timeout_seconds: 20
      applications:
        # Full application inventory (system_profiler, whole disk): slow, hourly.
        enabled: true
        interval_seconds: 3600
        command_timeout_seconds: 180
      software:
        # /Applications and ~/Applications every minute -> software.installed/removed with
        # the codesign status of NEW bundles only (MAC-005).
        enabled: true
        interval_seconds: 10
        include_user_applications: true
        settle_seconds: 30            # wait until a copied bundle is complete (no false
        max_defer_scans: 5            #   "invalid signature" mid-copy), at most 5 scans
        max_signature_checks: 4       # codesign calls per scan ...
        check_budget_seconds: 60      # ... within this much time
        codesign_timeout_seconds: 20
      asset:
        name: workstation-01
        # hostname is reported only when set here (the collector never reads it).
        hostname: null
        environment: lab
        criticality: medium
        interval_seconds: 300
        refresh_seconds: 900
