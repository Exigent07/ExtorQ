# ExtorQ node log collector (otel/opentelemetry-collector-contrib 0.165.0).
# Deployed by infra/kind/kind.sh as ConfigMap extorq-system/extorq-otel-config.
#
# Two pipelines, one exporter:
#   logs/containers: /var/log/pods/**  -> container parser -> k8s_attributes
#   logs/audit:      kube-apiserver audit log (raw JSON line kept as the body)
#   -> otlp_http (JSON) -> ExtorQ ingest gateway /v1/otlp/v1/logs (TLS, bearer token)
#
# File offsets and the sending queue share node-persistent file_storage. Batching
# runs at the exporter queue, downstream of the durable enqueue boundary.
extensions:
  health_check:
    endpoint: ${env:POD_IP}:13133
  file_storage:
    directory: /var/lib/extorq-otel
    create_directory: false
    timeout: 2s
    fsync: true
    compaction:
      on_start: true
      directory: /var/lib/extorq-otel
      max_transaction_size: 65536
  bearertokenauth/extorq:
    scheme: Bearer
    # Mounted from Secret extorq-system/extorq-otel-token (re-read when it changes).
    filename: /var/run/secrets/extorq/otel-token/token

receivers:
  file_log/containers:
    include:
      - /var/log/pods/*/*/*.log
      - /var/log/pods/*/*/*.log.*
    exclude:
      # Never read our own output (feedback loop).
      - /var/log/pods/extorq-system_extorq-otel-collector-*/*/*.log*
      # The kubelet writes temporary files during compression.
      - /var/log/pods/*/*/*.tmp
    compression: auto
    start_at: beginning
    include_file_path: true
    include_file_name: false
    # The normaliser keeps at most 16 KiB of a line; longer lines are cut here.
    max_log_size: 16KiB
    max_concurrent_files: 64
    poll_interval: 500ms
    storage: file_storage
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      # Pause on downstream rejection instead of advancing a failed read offset.
      max_elapsed_time: 0s
    operators:
      # CRI log format parser: timestamp, stream (log.iostream), partial-line
      # recombination, and k8s.{namespace,pod,container}.* from the file path.
      - type: container
        id: container-parser
        add_metadata_from_filepath: true
        max_log_size: 16384

  file_log/audit:
    include:
      # Active file plus rotated backups (kube-apiserver-audit-<timestamp>.log):
      # a backup's fingerprint matches the file it was rotated from, so reading
      # resumes at the stored offset instead of re-reading or skipping data.
      - /var/log/kubernetes/audit/kube-apiserver-audit*.log
    start_at: beginning
    include_file_path: false
    include_file_name: true
    # A longer line is cut, fails JSON parsing and is quarantined (visible, not silent).
    max_log_size: 256KiB
    poll_interval: 500ms
    storage: file_storage
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s

  prometheus/health:
    config:
      scrape_configs:
        - job_name: extorq-otel-health
          scrape_interval: 30s
          scrape_timeout: 5s
          static_configs:
            - targets: ["127.0.0.1:8888"]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: otelcol_(receiver_(accepted|refused)_log_records|exporter_(sent_log_records|send_failed_log_records|enqueue_failed_log_records|queue_(size|capacity)))(_total)?
              action: keep

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
    spike_limit_mib: 40

  k8s_attributes:
    auth_type: serviceAccount
    passthrough: false
    filter:
      # Only watch pods scheduled on this node.
      node_from_env_var: K8S_NODE_NAME
    # Do not process records before the pod/ReplicaSet caches are synced: after a
    # restart the receivers resume immediately, and records processed against an
    # empty cache would lose their workload / container.id metadata (and with it the
    # service attribution). Startup fails visibly if the API is unreachable for 30 s.
    wait_for_metadata: true
    wait_for_metadata_timeout: 30s
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.uid
    extract:
      metadata:
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.namespace.name
        - k8s.node.name
        - k8s.deployment.name
        - k8s.replicaset.name
        - k8s.daemonset.name
        - k8s.statefulset.name
        - k8s.job.name
        - k8s.cronjob.name
        # Container-level metadata, matched on k8s.container.name and
        # k8s.container.restart_count (set by the container parser from the log path).
        - container.id
        - container.image.name
        - container.image.tags

  resource/containers:
    attributes:
      - key: extorq.source
        value: container
        action: upsert
      # Files are always read on the collector's own node. k8s_attributes cannot
      # associate static control-plane pods (their log-path UID is the static-pod
      # hash, not the mirror pod UID), so fill the node name only when missing.
      - key: k8s.node.name
        value: ${env:K8S_NODE_NAME}
        action: insert
      - key: k8s.cluster.name
        value: extorq-lab
        action: upsert
      - key: extorq.collector.version
        value: otelcol-contrib/0.165.0
        action: upsert

  resource/audit:
    attributes:
      - key: extorq.source
        value: audit
        action: upsert
      - key: k8s.cluster.name
        value: extorq-lab
        action: upsert
      - key: k8s.node.name
        value: ${env:K8S_NODE_NAME}
        action: upsert
      - key: extorq.collector.version
        value: otelcol-contrib/0.165.0
        action: upsert

  resource/health:
    attributes:
      - key: k8s.node.name
        value: ${env:K8S_NODE_NAME}
        action: upsert
      - key: k8s.cluster.name
        value: extorq-lab
        action: upsert

exporters:
  otlp_http/extorq:
    logs_endpoint: https://host.docker.internal:8443/v1/otlp/v1/logs
    encoding: json
    compression: gzip
    timeout: 15s
    auth:
      authenticator: bearertokenauth/extorq
    tls:
      ca_file: /etc/extorq/gateway-ca/ca.crt
      min_version: "1.2"
    retry_on_failure:
      enabled: true
      initial_interval: 2s
      randomization_factor: 0.5
      multiplier: 2
      max_interval: 60s
      # The Collector logs a terminal drop if the retry budget is exhausted.
      max_elapsed_time: 2h
    sending_queue:
      enabled: true
      storage: file_storage
      num_consumers: 2
      sizer: requests
      queue_size: 2000
      block_on_overflow: true
      batch:
        sizer: items
        # Two 256 KiB audit lines fit within the 4 MiB JSON gateway limit even
        # at the worst case of six output bytes per input byte, plus metadata.
        min_size: 2
        max_size: 2
        flush_timeout: 250ms

  otlp_http/health:
    metrics_endpoint: https://host.docker.internal:8443/v1/otlp/v1/metrics
    encoding: json
    compression: gzip
    timeout: 5s
    auth:
      authenticator: bearertokenauth/extorq
    tls:
      ca_file: /etc/extorq/gateway-ca/ca.crt
      min_version: "1.2"
    # A sample only describes the current process. A later scrape replaces a
    # failed one, independently of log queue progress.
    retry_on_failure:
      enabled: false
    sending_queue:
      enabled: false

service:
  extensions: [health_check, file_storage, bearertokenauth/extorq]
  telemetry:
    logs:
      level: info
      encoding: json
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
  pipelines:
    logs/containers:
      receivers: [file_log/containers]
      processors: [memory_limiter, k8s_attributes, resource/containers]
      exporters: [otlp_http/extorq]
    logs/audit:
      receivers: [file_log/audit]
      processors: [memory_limiter, resource/audit]
      exporters: [otlp_http/extorq]
    metrics/health:
      receivers: [prometheus/health]
      processors: [resource/health]
      exporters: [otlp_http/health]
