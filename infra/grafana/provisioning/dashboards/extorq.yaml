# ExtorQ dashboards (owner: D1), generated by infra/grafana/generate_dashboards.py.
# Baked into the image; UI changes cannot be saved and dashboards cannot be deleted.
apiVersion: 1

providers:
  - name: extorq
    orgId: 1
    folder: ExtorQ
    folderUid: extorq
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 300
    options:
      path: /etc/grafana/dashboards/extorq
      foldersFromFilesStructure: false
