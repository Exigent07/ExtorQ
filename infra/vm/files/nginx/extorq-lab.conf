# ExtorQ lab reverse proxy for lab-portal (deployed by cloud-init from
# infra/vm/files/nginx/extorq-lab.conf). Access logs are JSON lines sent to
# journald through /dev/log (SYSLOG_IDENTIFIER=nginx_access). The logged path is
# $uri (normalised path, no query string); $request_uri is never logged.
log_format extorq_json escape=json
  '{"time_iso8601":"$time_iso8601","msec":$msec,"remote_addr":"$remote_addr",'
  '"request_method":"$request_method","uri":"$uri","status":$status,'
  '"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,'
  '"http_user_agent":"$http_user_agent","request_id":"$request_id","host":"$host"}';

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    access_log syslog:server=unix:/dev/log,tag=nginx_access,nohostname extorq_json;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The app trusts these two headers only from 127.0.0.1 (this proxy).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 2s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
    }
}
