# ExtorQ lab sshd hardening (deployed by cloud-init from
# infra/vm/files/sshd/10-extorq-hardening.conf). Included first by
# /etc/ssh/sshd_config, so these values win (sshd: first value obtained wins).
HostKey /etc/ssh/ssh_host_ed25519_key
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
MaxAuthTries 3
MaxStartups 10:30:60
LoginGraceTime 30
LogLevel VERBOSE
X11Forwarding no
AllowAgentForwarding no
PermitUserEnvironment no
AllowUsers extorq-admin extorq-collector

# The collector account can only reach the read-only dispatch boundary.
# Its key lives outside its home (root-owned 0644) so the account cannot
# change or extend it.
Match User extorq-collector
    AuthorizedKeysFile /etc/ssh/authorized_keys/%u
    ForceCommand /usr/local/sbin/extorq-collect-dispatch
    PermitTTY no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTunnel no
    PermitUserRC no
    DisableForwarding yes
    PermitListen none
    PermitOpen none
    MaxSessions 4
