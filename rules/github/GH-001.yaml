rule_id: GH-001
version: 2.0.0
title: GitHub Actions workflow permission escalation
description: >-
  A commit changed a GitHub Actions workflow so that its GITHUB_TOKEN gains privileges: it
  adds `permissions: write-all` or adds a sensitive write scope (contents, actions, packages,
  id-token, ...) to the effective permissions. Evidence is the collector's before/after
  analysis of the workflow file at that commit. A workflow that cannot be parsed is compared
  lexically by the collector (fail closed, analysis = lexical_fallback) and still alerts.
  Since v2.0.0 this rule is permission escalation only: privileged triggers with untrusted
  checkout are GH-002, unpinned actions GH-003 and script injection GH-004. Confidence: high
  when both versions parsed and the effective permissions are known; medium for a lexical
  comparison or unknown repository default permissions; low when a version did not parse
  and no lexical comparison was made.
severity: high
status: stable
mitre_techniques: [T1098, T1195.002]
asset_types: [github_repository]
requires:
  - source_type: github.api
    event_types: [github.workflow.modified]
schedule:
  interval_seconds: 120
  lookback_seconds: 7200
  late_tolerance_seconds: 3600
dedup:
  strategy: event
group_by: [repository, workflow_path, commit_sha]
params:
  sensitive_scopes:
    - actions
    - attestations
    - checks
    - contents
    - deployments
    - id-token
    - packages
    - pages
    - pull-requests
    - security-events
    - statuses
false_positives:
  - >-
    Release or deployment workflows that need contents, packages or id-token write.
    Handling: reported once per commit and workflow; the alert shows the permissions before
    and after so the reviewer can check that the scope is limited to the job that needs it.
    No path or actor allowlist (both are chosen by the committer).
  - >-
    Write scopes that only appear because the repository default token permission is
    write and a workflow without a permissions block was added. Handling: confidence stays
    high only when the default is known; the fix is a read-only repository default.
blind_spots:
  - >-
    Privilege changes made outside workflow files (repository or organisation default
    workflow permissions, environment protection rules) appear as
    github.repo.settings_changed, not here.
  - >-
    Only commits on monitored branches that the collector polls are analysed; force-pushed or
    deleted history between polls can be missed (the collector reports such gaps).
  - Reusable workflows referenced from other repositories are analysed only as references.
  - >-
    Lexical fallback (unparseable workflow) cannot tell which job a permissions block belongs
    to and examines a bounded prefix of very large files (features.lexical_scan_truncated);
    it over-reports rather than under-reports.
references:
  - https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions
  - https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
query: GH-001.sql
summary_template: >-
  Workflow {workflow_path} in {repository} gained token permissions at commit {commit_sha}
  by {actor}: write-all {write_all_added}; sensitive scopes {sensitive_scopes_added};
  permissions {permissions_before} -> {permissions_after}; analysis {analysis_methods}
tests:
  - name: matrix-ci-workflow-write-all
    description: >-
      Matrix positive: the CI workflow's `permissions: contents: read` replaced by
      `permissions: write-all` (attributes computed by the collector's workflow analyser).
    fixture: tests/GH-001/positive_matrix_write_all.jsonl
    expect: alert
    alerts: 1
    confidence: high
    features:
      write_all_added: true
  - name: id-token-write-default-unknown
    description: Sensitive scope added while the repository default permission is unknown.
    fixture: tests/GH-001/positive_scope_unknown_default.jsonl
    expect: alert
    alerts: 1
    confidence: medium
  - name: lexical-fallback-write-all
    description: >-
      The new workflow version is unparseable (duplicate mapping key) but adds permissions
      write-all; the analyser compares it lexically (analysis = lexical_fallback, effective
      permissions unknown): alert, medium.
    fixture: tests/GH-001/positive_lexical_fallback_write_all.jsonl
    expect: alert
    alerts: 1
    confidence: medium
    features:
      analysis_methods: [lexical_fallback]
      write_all_added: true
      effective_permissions_unknown: true
    summary_contains: "analysis lexical_fallback"
  - name: matrix-control-permissions-reduced
    description: >-
      Matrix negative control: the revert, which reduces permissions from write-all back to
      contents: read.
    fixture: tests/GH-001/negative_matrix_permissions_reduced.jsonl
    expect: no_alert
  - name: benign-workflow-edits
    description: Workflow edits that do not add privileges (step change, read scope, push trigger).
    fixture: tests/GH-001/negative_benign_edits.jsonl
    expect: no_alert
  - name: lexical-fallback-benign
    description: An unparseable edit whose lexical comparison adds no privilege.
    fixture: tests/GH-001/negative_lexical_fallback_benign.jsonl
    expect: no_alert
  - name: privileged-trigger-is-gh002-not-gh001
    description: >-
      pull_request_target with a checkout of the pull request head added, permissions
      unchanged: GH-002's case, not a permission escalation.
    fixture: tests/GH-001/negative_privileged_trigger_only.jsonl
    expect: no_alert
