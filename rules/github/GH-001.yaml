rule_id: GH-001
version: 1.1.0
title: GitHub Actions workflow privilege escalation
description: >-
  A commit changed a GitHub Actions workflow so that it gains privileges: it adds
  `permissions: write-all`, adds a sensitive write scope (contents, actions, packages,
  id-token, ...), adds a privileged trigger (pull_request_target, workflow_run, ...) or adds
  a checkout of untrusted pull-request code under a privileged trigger. Evidence is the
  collector's before/after analysis of the workflow file at that commit. A workflow that
  cannot be parsed is compared lexically by the collector (fail closed,
  analysis = lexical_fallback) and still alerts, with confidence medium.
severity: high
status: stable
mitre_techniques: [T1195.002, T1098]
asset_types: [github_repository]
requires:
  - source_type: github.api
    event_types: [github.workflow.modified]
schedule:
  interval_seconds: 120
  lookback_seconds: 7200
  late_tolerance_seconds: 3600
dedup:
  strategy: event
group_by: [repository, workflow_path, commit_sha]
params:
  sensitive_scopes:
    - actions
    - attestations
    - checks
    - contents
    - deployments
    - id-token
    - packages
    - pages
    - pull-requests
    - security-events
    - statuses
  dangerous_triggers: [pull_request_target, workflow_run]
false_positives:
  - >-
    Legitimate release or deployment workflows that need contents/packages/id-token write
    (review the commit author and whether the scope is limited to the job that needs it).
  - >-
    Repository maintainers adding pull_request_target for labelling bots that never check
    out untrusted code (still review it: the trigger runs with a write token).
blind_spots:
  - Privilege changes made outside workflow files (repository or organisation default
    workflow permissions, environment protection rules) are not workflow commits; they
    appear as github.repo.settings_changed, not here.
  - Only commits on monitored branches that the collector polls are analysed; force-pushed
    or deleted history between polls can be missed (the collector reports such gaps).
  - Reusable workflows referenced from other repositories are analysed only as references.
  - Effective permissions depend on the repository default; when it is unknown the
    analysis is marked effective_permissions_unknown (confidence medium).
  - >-
    Lexical fallback (unparseable workflow) cannot tell which job a permissions block or
    checkout belongs to and examines a bounded prefix of very large files
    (features.lexical_scan_truncated); it over-reports rather than under-reports.
references:
  - https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions
  - https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
query: GH-001.sql
summary_template: >-
  Workflow {workflow_path} in {repository} gained privileges at commit {commit_sha} by
  {actor}: write-all {write_all_added}; scopes {sensitive_scopes_added}; triggers
  {risky_triggers_added}; untrusted checkout {untrusted_checkout_added}; analysis
  {analysis_methods}
tests:
  - name: write-all-added
    fixture: tests/GH-001/positive_write_all.jsonl
    expect: alert
    alerts: 1
    confidence: high
  - name: pull-request-target-added-sim
    description: Dangerous trigger added (simulation-tagged commit).
    fixture: tests/GH-001/positive_pull_request_target_sim.jsonl
    expect: alert
    alerts: 1
  - name: id-token-write-default-unknown
    description: Sensitive scope added while the repository default permission is unknown.
    fixture: tests/GH-001/positive_scope_unknown_default.jsonl
    expect: alert
    alerts: 1
    confidence: medium
  - name: benign-workflow-edits
    description: Workflow edits that do not add privileges (step change, read scope, push trigger).
    fixture: tests/GH-001/negative_benign_edits.jsonl
    expect: no_alert
  - name: lexical-fallback-write-all
    description: >-
      The new workflow version is unparseable (duplicate mapping key) but adds
      permissions write-all and pull_request_target; C1's analyser compares it lexically
      (analysis = lexical_fallback, effective permissions unknown): alert, medium.
    fixture: tests/GH-001/positive_lexical_fallback_write_all.jsonl
    expect: alert
    alerts: 1
    confidence: medium
    features:
      analysis_methods: [lexical_fallback]
      write_all_added: true
      risky_triggers_added: [pull_request_target]
      effective_permissions_unknown: true
    summary_contains: "analysis lexical_fallback"
  - name: lexical-fallback-benign
    description: An unparseable edit whose lexical comparison adds no privilege.
    fixture: tests/GH-001/negative_lexical_fallback_benign.jsonl
    expect: no_alert
  - name: c1-collector-output-gh001-scenario
    description: >-
      C1's tests/fixtures/github/gh001_collector_output.jsonl copied verbatim (synthetic
      GitHub API fake, real collector code path): baseline commit, the escalation commit
      (write-all, pull_request_target, untrusted checkout) and the cleanup commit. Exactly
      one alert, high, for the escalation; none for baseline or cleanup.
      tests/rules/test_gh001_collector_contract.py runs the same check on C1's current file.
    fixture: tests/GH-001/c1_collector_output.jsonl
    expect: alert
    alerts: 1
    confidence: high
    entities:
      commit_sha: cc816a42e0fc91f07530c6c94bc28b27f2ea8ae7
  - name: c1-collector-output-lexical-fallback
    description: >-
      C1's tests/fixtures/github/gh001_lexical_fallback.jsonl copied verbatim: the same
      scenario with an unparseable escalation commit (compared lexically by analyser 1.1.0)
      and a cleanup commit. Exactly one alert, medium, for the escalation.
    fixture: tests/GH-001/c1_lexical_fallback.jsonl
    expect: alert
    alerts: 1
    confidence: medium
    entities:
      commit_sha: 20cf45b8869252ee1559dc36478c2a165be76788
    features:
      analysis_methods: [lexical_fallback]

