rule_id: CORR-002
version: 1.3.0
title: Ordered HTTP probing, SSH failures and systemd persistence on one host
description: >-
  Multi-stage sequence on one Linux host, in this order within 30 minutes: (1) HTTP probing
  (at least 10 client-error responses to one source, including at least 5 distinct
  probe-like routes, within 5 minutes), (2) SSH authentication failures (at least 3 failed
  connections or 5 failed attempts from one source within 5 minutes), (3) an unexpected
  systemd persistence change with creation or modification evidence (unit created, modified
  or enabled outside the allowlist, or a successful auditd create/modify syscall on a unit
  file; deletions are context only). The rule shows ordered co-occurrence of independent
  observations across three services (web server, sshd, systemd); it does not establish
  that one stage caused the next or that one actor performed all of them. Confidence:
  medium when the probing and the SSH failures share a source address that is not a shared
  NAT/gateway address; low otherwise.
severity: high
status: experimental
mitre_techniques: [T1595.003, T1110, T1543.002]
asset_types: [linux_host]
requires:
  - source_type: linux.nginx
    event_types: [http.request]
  - source_type: linux.apache
    event_types: [http.request]
    optional: true
  - source_type: linux.app
    event_types: [http.request]
    optional: true
  - source_type: linux.journald
    event_types:
      - auth.ssh.login_failed
      - auth.ssh.invalid_user
      - auth.ssh.preauth_closed
      - auth.ssh.max_auth_exceeded
  - source_type: linux.inventory
    event_types:
      - persistence.systemd.unit_created
      - persistence.systemd.unit_modified
      - persistence.systemd.unit_enabled
  - source_type: linux.auditd
    event_types: [file.audit.watch]
    optional: true
schedule:
  interval_seconds: 120
  lookback_seconds: 2700
  late_tolerance_seconds: 900
dedup:
  strategy: window_bucket
  bucket_seconds: 1800
group_by: [asset_id]
params:
  sequence_seconds: 1800
  probe_window_seconds: 300
  probe_min_requests: 10
  probe_min_routes: 5
  # Paths typically requested by scanners/exploit probes (RE2, case-insensitive).
  probe_route_pattern: >-
    (?i)(\.env|\.git|\.svn|\.aws|\.ssh|\.ht(access|passwd)|wp-|wordpress|phpmyadmin|xmlrpc|cgi-bin|server-status|actuator|/admin|/manager|/console|/shell|/backup|/config|/debug|/vendor/|/etc/passwd|\.\./|\.php|\.asp|\.jsp|/solr|/jenkins|/boaform|/hnap1|/owa|/remote/|/druid|/telescope)
  ssh_window_seconds: 300
  ssh_min_connections: 3
  ssh_min_failures: 5
  audit_key: extorq_systemd
  # Stage 3 needs CREATION or MODIFICATION evidence (v1.2.0). auditd syscalls that create
  # or modify a unit file (allowlist: only successful hits count; anything else, including
  # unknown or numeric syscall values, fails closed).
  change_syscalls:
    - open
    - openat
    - openat2
    - creat
    - truncate
    - ftruncate
    - rename
    - renameat
    - renameat2
    - link
    - linkat
    - symlink
    - symlinkat
    - mknod
    - mknodat
    - chmod
    - fchmod
    - fchmodat
    - fchmodat2
    - chown
    - fchown
    - fchownat
    - lchown
  # Removals of unit files (and nametype DELETE path items) are reported as context only.
  deletion_syscalls: [unlink, unlinkat, rmdir]
  # systemd unit directories (the VM's auditd watches cover the first two).
  unit_dirs:
    - /etc/systemd/system/
    - /usr/lib/systemd/system/
    - /lib/systemd/system/
    - /run/systemd/system/
  # Unit files and drop-ins (RE2); editor swap/backup files are not units.
  unit_file_pattern: >-
    [.](service|socket|timer|path|mount|automount|swap|target|slice|scope|conf)$
  allowlist_paths: []
  # Addresses that aggregate many origins: a shared source IP through them is not identity.
  shared_nat_ips: ["10.0.2.2", "172.18.0.1", "127.0.0.1", "::1"]
false_positives:
  - >-
    Unrelated activity that happens to line up: an internet scanner probing the web server,
    a different client mistyping an SSH password and an administrator installing a service
    within the same half hour. Handling: the stages must occur in order within 30 minutes
    and each must reach its own threshold; confidence stays low unless the probing and the
    SSH failures share a source IP that is not a shared NAT address, and even then a shared
    IP is not proof of one actor (causation_established is always false).
  - >-
    Penetration tests and vulnerability scans that cover web and SSH, followed by planned
    maintenance. Handling: no suppression; the alert names the units and their writers so
    the persistence change can be checked against change records.
  - >-
    Every connection from the Mac host reaches the VM from the QEMU gateway 10.0.2.2, so a
    shared source IP there carries no identity. Handling: shared NAT/gateway addresses are
    configured (shared_nat_ips) and keep the confidence low.
  - >-
    Re-installing an unchanged unit file is a genuine write and counts (observed live: the
    VM redeploy runs install on lab-portal.service: unlinkat, openat CREATE, fchownat,
    fchmodat). Handling: the features separate persistence_units_inventory_confirmed (the
    inventory saw new or changed content) from persistence_units_audit_only (write seen by
    auditd only), and persistence_writers names the writing executable.
blind_spots:
  - >-
    Sequences slower than 30 minutes, probing below the thresholds, or SSH failures below
    the thresholds (each stage alone is covered by HTTP/VM-001 style rules).
  - >-
    Persistence other than systemd units (cron, shell profiles, SSH keys) and changes the
    inventory diff misses between snapshots without an auditd watch hit.
  - >-
    Web servers whose access logs are not collected (only nginx, Apache and the web app are
    parsed), probing over TLS-terminating proxies that hide the client address, and SSH on
    hosts without journald collection.
  - A stage that happened before the evaluation lookback (45 minutes) is not considered.
  - >-
    auditd logs without ENRICHED syscall names (numeric syscall values) never count as
    stage 3 (fail closed); the inventory diff still does.
references:
  - https://attack.mitre.org/techniques/T1595/003/
  - https://attack.mitre.org/techniques/T1110/
  - https://attack.mitre.org/techniques/T1543/002/
  - https://clickhouse.com/docs/sql-reference/aggregate-functions/parametric-functions#windowfunnel
query: CORR-002.sql
summary_template: >-
  Ordered sequence on {asset_id}: HTTP probing from {probe_src_ips} ({probe_requests} client
  errors, {probe_routes_distinct} probe-like routes), then SSH failures from {ssh_src_ips}
  ({ssh_failed_connections} connections), then systemd change of {units} (writers
  {persistence_writers}) within {sequence_seconds}s; unit removals in the window, context
  only: {context_unit_removals}; same non-NAT source IP: {same_non_nat_source_ip}; shared
  NAT/gateway address involved: {source_ip_shared_nat}; ordered co-occurrence, not proof of
  causation ({confidence} confidence)
tests:
  - name: matrix-http-ssh-systemd-sequence-via-qemu-nat
    description: >-
      Matrix positive: the HTTP-001, VM-001 and VM-002 tests run in that order within 30
      minutes from the Mac (all through the QEMU gateway 10.0.2.2): ordered chain, low
      confidence because the shared source is a NAT address.
    fixture: tests/CORR-002/positive_matrix_sequence_nat.jsonl
    expect: alert
    alerts: 1
    confidence: low
    features:
      persistence_units: [extorq-test-persist.service]
      same_source_ip: true
      same_non_nat_source_ip: false
      source_ip_shared_nat: true
      causation_established: false
  - name: ordered-sequence-same-external-source
    description: >-
      Probing, SSH failures and a new unit from one documentation-range address within
      20 minutes, corroborated by auditd.
    fixture: tests/CORR-002/positive_same_external_source.jsonl
    expect: alert
    alerts: 1
    confidence: medium
    features:
      persistence_units: [backdoor.service]
      persistence_units_inventory_confirmed: [backdoor.service]
      persistence_units_audit_only: []
      persistence_change_types: [audit.openat, persistence.systemd.unit_created]
      context_unit_removals: []
      same_non_nat_source_ip: true
  - name: different-sources
    description: Probing and SSH failures from two different external addresses, then a unit.
    fixture: tests/CORR-002/positive_different_sources.jsonl
    expect: alert
    alerts: 1
    confidence: low
  - name: matrix-control-ssh-failures-alone
    description: >-
      Matrix negative control: the VM-001 test alone (SSH failures, no probing before them and
      no persistence after them).
    fixture: tests/CORR-002/negative_matrix_ssh_failures_alone.jsonl
    expect: no_alert
  - name: wrong-order
    description: The unit is created before the SSH failures (persistence first).
    fixture: tests/CORR-002/negative_wrong_order.jsonl
    expect: no_alert
  - name: too-slow
    description: The persistence change happens 40 minutes after the probing.
    fixture: tests/CORR-002/negative_too_slow.jsonl
    expect: no_alert
  - name: missing-persistence-and-baseline
    description: Probing and SSH failures, but only a baseline-snapshot unit event.
    fixture: tests/CORR-002/negative_missing_stage_baseline.jsonl
    expect: no_alert
  - name: below-probe-threshold
    description: Four probe-like 404s only, then SSH failures and a new unit.
    fixture: tests/CORR-002/negative_below_probe_threshold.jsonl
    expect: no_alert
  - name: deletion-is-not-persistence
    description: >-
      Probing and SSH failures followed only by an auditd unlinkat of a unit file by rm
      (the shape of a VM-002 cleanup).
    fixture: tests/CORR-002/negative_deletion_only.jsonl
    expect: no_alert
  - name: non-changing-audit-hits-are-not-persistence
    description: >-
      Probing and SSH failures followed by auditd hits that neither create nor modify a
      unit: a failed openat (EACCES), fsetxattr on an unresolved path, an editor swap file,
      a numeric syscall value and a unit moved out of the directory (rename DELETE side).
    fixture: tests/CORR-002/negative_noncounting_audit_hits.jsonl
    expect: no_alert
  - name: audit-create-with-removal-as-context
    description: >-
      Persistence seen by auditd only (openat CREATE of a unit, no inventory diff yet) plus
      an unlinkat of another unit in the window: the creation is stage 3, the removal is
      listed as context and is not evidence.
    fixture: tests/CORR-002/positive_audit_create_removal_context.jsonl
    expect: alert
    alerts: 1
    confidence: medium
    features:
      persistence_units: [beacon.service]
      persistence_units_inventory_confirmed: []
      persistence_units_audit_only: [beacon.service]
      persistence_change_types: [audit.openat]
      persistence_events: 1
      context_unit_removals: [old-agent.service]
      context_removal_events: 1
      causation_established: false
    summary_contains: "context only: old-agent.service"
