rule_id: VM-002
version: 1.4.0
title: New or modified systemd unit (persistence)
description: >-
  A systemd unit file appeared or changed in a persistence location on a Linux host (or an
  existing unit was newly enabled), as observed by comparing inventory snapshots collected
  over SSH. Confidence: high when an auditd file watch hit (key extorq_systemd) creates or
  modifies the same path no more than two minutes before the inventory observation;
  medium for the inventory diff alone and for enable-only changes. Deletions and
  other auditd hits corroborate nothing. Unit state changes (start, stop, restart) are not
  persistence and are never evaluated. Exact allowlisted paths and the collector's baseline
  snapshot are not alerted.
severity: high
status: stable
mitre_techniques: [T1543.002]
asset_types: [linux_host]
requires:
  - source_type: linux.inventory
    event_types:
      - persistence.systemd.unit_created
      - persistence.systemd.unit_modified
      - persistence.systemd.unit_enabled
  - source_type: linux.auditd
    event_types: [file.audit.watch]
    optional: true
schedule:
  interval_seconds: 60
  lookback_seconds: 1800
  late_tolerance_seconds: 600
dedup:
  strategy: event
group_by: [asset_id, unit_path, sha256]
params:
  audit_key: extorq_systemd
  corroboration_seconds: 120
  # auditd syscalls that CREATE or MODIFY a unit file (allowlist, v1.2.0). Only successful
  # hits count. Everything else corroborates nothing: deletions (unlink, unlinkat, rmdir),
  # xattr and timestamp changes, failed attempts, and unknown or numeric (non-enriched)
  # syscall values, so an unrecognised syscall fails closed instead of counting.
  change_syscalls:
    - open
    - openat
    - openat2
    - creat
    - truncate
    - ftruncate
    - rename
    - renameat
    - renameat2
    - link
    - linkat
    - symlink
    - symlinkat
    - mknod
    - mknodat
    - chmod
    - fchmod
    - fchmodat
    - fchmodat2
    - chown
    - fchown
    - fchownat
    - lchown
  # Exact unit file paths expected to change (e.g. managed by configuration management).
  # Paths, not unit names: only root can write the unit directories.
  allowlist_paths: []
  # Units whose ENABLEMENT alone is expected. Applies only to enable-only rows (the unit
  # file itself did not change in the window): a new or modified file with that name still
  # alerts as unit_created/unit_modified, so reusing an allowlisted name gains nothing.
  allowlist_units: []
false_positives:
  - >-
    Package installation or upgrade that ships or updates a unit. Handling: vendor units
    under /usr/lib/systemd are flagged (vendor_unit) and the investigation context shows the
    package.* changes of the asset; no package-name allowlist (an attacker can name a unit
    after a package).
  - >-
    Configuration management or an administrator deploying a service. Handling: exact unit
    paths controlled by that process can be allowlisted (allowlist_paths); a path is used
    instead of a unit name because only root can write those directories, and
    config.file.changed keeps monitoring the allowlisted file.
  - >-
    Re-installing an unchanged unit file (a redeploy) is a genuine write that auditd records.
    Handling: rewriting identical content produces no inventory diff, so nothing alerts; a
    delete and re-create with identical content extends the existing alert, because the alert
    identity includes the content digest.
blind_spots:
  - Units created and removed between two inventory snapshots (short-lived persistence);
    auditd still records the write but this rule triggers on the inventory diff only.
  - Persistence through other mechanisms (cron, shell profiles, rc.local, timers outside
    watched directories, user units outside the collected paths).
  - >-
    Allowlisting is path-based: an attacker able to write an allowlisted unit evades this
    rule (config.file.changed monitoring of that path is the compensating control).
  - Without auditd (missing_sources), the writer process is unknown and confidence is medium.
  - >-
    Audit logs written without ENRICHED syscall names (numeric syscall values only) never
    corroborate (allowlist of names; fail closed): the alert still fires from the inventory
    diff, with confidence medium.
references:
  - https://attack.mitre.org/techniques/T1543/002/
  - https://www.freedesktop.org/software/systemd/man/latest/systemd.unit.html
query: VM-002.sql
summary_template: >-
  systemd unit {unit} ({unit_path}) changed on {asset_id}: {change_types}; ExecStart
  {exec_start}; auditd corroborated: {audit_corroborated}; writer {writer_executables}
  ({writer_syscalls})
tests:
  - name: same-path-write-outside-corroboration-window
    description: Synthetic timing variant with an earlier write to the same unit path.
    fixture: tests/VM-002/positive_unrelated_same_path_write.jsonl
    expect: alert
    alerts: 1
    confidence: medium
    features:
      audit_corroborated: false
  - name: matrix-unit-created-enabled-captured
    description: >-
      Matrix positive, captured: the admin's sudo shell writes
      /etc/systemd/system/extorq-test-<id>.service (ExecStart=/bin/true), reloads systemd and
      enables the unit (real VM output parsed by the Linux collector's own inventory and auditd
      code). The inventory diff, the enable symlink and the auditd openat agree: high.
    fixture: tests/VM-002/positive_matrix_unit_created_enabled.jsonl
    expect: alert
    alerts: 1
    confidence: high
    entities: {unit: extorq-test-0e49c82d82bc.service}
    features:
      audit_corroborated: true
      writer_syscalls: [openat]
      writer_executables: [/usr/bin/dash]
      wanted_by: [multi-user.target]
  - name: unit-modified-inventory-only
    description: >-
      Existing unit content changed; the auditd hits on the path corroborate nothing: a
      deletion (unlinkat by rm), a failed openat (EACCES), an fsetxattr and an unknown
      numeric syscall.
    fixture: tests/VM-002/positive_modified_inventory_only.jsonl
    expect: alert
    alerts: 1
    confidence: medium
    features:
      audit_corroborated: false
      writer_executables: []
  - name: unit-renamed-into-place-with-auditd
    description: >-
      A unit written in /tmp and renamed into /etc/systemd/system (renameat: the primary
      path item is the /tmp source, the CREATE item is the unit path) plus the inventory
      diff of the new unit: the rename corroborates (high).
    fixture: tests/VM-002/positive_renamed_into_place.jsonl
    expect: alert
    alerts: 1
    confidence: high
    features:
      audit_corroborated: true
      writer_syscalls: [renameat]
  - name: unit-enabled-only
    description: An existing unit newly enabled (symlink in multi-user.target.wants).
    fixture: tests/VM-002/positive_enabled_only.jsonl
    expect: alert
    alerts: 1
    confidence: medium
  - name: matrix-control-restart-existing-unit
    description: >-
      Matrix negative control: an existing unit (nginx.service) is restarted and systemd
      reloaded. Only state changes are logged; no unit file changes, so no alert.
    fixture: tests/VM-002/negative_matrix_restart_existing_unit.jsonl
    expect: no_alert
  - name: cleanup-baseline-and-unrelated
    description: >-
      The captured cleanup of the matrix unit (inventory deletion and the auditd unlinkat by
      rm), a baseline snapshot event, an auditd hit with another key and a cron change:
      nothing to alert.
    fixture: tests/VM-002/negative_baseline_cleanup_unrelated.jsonl
    expect: no_alert
